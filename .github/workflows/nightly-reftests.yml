name: Nightly Reference Tests

# SIX_SHARD_CALIBRATION_MATRIX_ONLY
# - GitHub-hosted ubuntu-latest matrix, 6 shards
# - threads=2, 10-minute timebox per shard
# - ONE pass only (no determinism run-2)
# - NO full build, NO final archives, NO publication
# Locked generation source: f37421391232170b69efeb90ace7a1bea34b03d5

on:
  # Manual only: do not auto-start calibration on push after source fixes.
  workflow_dispatch:
    inputs:
      ref:
        description: SHA/branch to generate from (use repair commit after S3/S6 fixes)
        default: ""
        type: string
        required: false
      calibration_minutes:
        description: Hard timebox minutes per shard
        default: "10"
        type: string
        required: true
      threads:
        description: Worker threads per shard
        default: "2"
        type: string
        required: true

jobs:
  calibrate-shard:
    name: calibrate-${{ matrix.shard_id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard_id: S1
            runners: bls,ssz_generic,ssz_static,shuffling
          - shard_id: S2
            runners: epoch_processing,finality,rewards,sanity
          - shard_id: S3
            runners: operations,networking
          - shard_id: S4
            runners: fork_choice,forks,transition
          - shard_id: S5
            runners: random,sync,genesis,merkle_proof
          - shard_id: S6
            runners: kzg,light_client
    env:
      GEN_REPO: sila-chain/consensus-specs
      # Prefer explicit ref; otherwise the commit that contains this workflow file.
      GEN_REF: ${{ inputs.ref || github.sha }}
      CALIBRATION_MINUTES: ${{ inputs.calibration_minutes || '10' }}
      GEN_THREADS: ${{ inputs.threads || '2' }}
      SHARD_ID: ${{ matrix.shard_id }}
      SHARD_RUNNERS: ${{ matrix.runners }}
      MODE: SIX_SHARD_CALIBRATION_MATRIX_ONLY
      FULL_BUILD_AUTHORISED: "NO"
      DETERMINISM_RUN_2_AUTHORISED: "NO"

    steps:
      - name: Checkout locked source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ env.GEN_REPO }}
          path: consensus-specs
          ref: ${{ env.GEN_REF }}

      - name: Verify checkout SHA and runner names
        working-directory: consensus-specs
        run: |
          set -euo pipefail
          HEAD=$(git rev-parse HEAD)
          {
            echo "MODE=${MODE}"
            echo "SHARD_ID=${SHARD_ID}"
            echo "SHARD_RUNNERS=${SHARD_RUNNERS}"
            echo "GEN_REPO=${GEN_REPO}"
            echo "GEN_REF=${GEN_REF}"
            echo "CHECKED_OUT_HEAD=${HEAD}"
            echo "THREADS=${GEN_THREADS}"
            echo "CALIBRATION_MINUTES=${CALIBRATION_MINUTES}"
            echo "WORKFLOW_SHA=${{ github.sha }}"
            echo "EVENT_NAME=${{ github.event_name }}"
          } | tee ../shard-identity.txt

          # If GEN_REF is a full SHA, require exact checkout match.
          if [[ "${GEN_REF}" =~ ^[0-9a-f]{40}$ ]] && [ "$HEAD" != "$GEN_REF" ]; then
            echo "CHECKOUT_SHA_MISMATCH requested=${GEN_REF} actual=${HEAD}"
            echo "FAIL_REASON=CHECKOUT_SHA_MISMATCH" | tee -a ../shard-metrics.txt
            exit 1
          fi

          # Official top-level runners with get_test_cases at this commit
          mapfile -t OFFICIAL < <(
            for f in tests/generators/runners/*.py; do
              base=$(basename "$f" .py)
              if grep -qE '^def get_test_cases\b' "$f"; then
                echo "$base"
              fi
            done | sort
          )
          echo "OFFICIAL_RUNNER_COUNT=${#OFFICIAL[@]}" | tee -a ../shard-identity.txt
          printf '%s\n' "${OFFICIAL[@]}" | tee ../official-runners.txt

          IFS=',' read -r -a WANT <<< "${SHARD_RUNNERS}"
          UNKNOWN=0
          for r in "${WANT[@]}"; do
            found=0
            for o in "${OFFICIAL[@]}"; do
              if [ "$r" = "$o" ]; then found=1; break; fi
            done
            if [ "$found" -ne 1 ]; then
              echo "UNKNOWN_RUNNER=$r"
              UNKNOWN=$((UNKNOWN+1))
            fi
          done
          if [ "$UNKNOWN" -ne 0 ]; then
            echo "FAIL_REASON=UNKNOWN_RUNNER" | tee -a ../shard-metrics.txt
            exit 1
          fi
          echo "UNKNOWN_RUNNER_COUNT=0" | tee -a ../shard-identity.txt

      - name: Host baseline
        run: |
          set -euo pipefail
          {
            echo "=== free -h ==="; free -h
            echo "=== nproc ==="; nproc
            echo "=== df -h ==="; df -h
            echo "=== lscpu ==="; lscpu | sed -n '1,20p'
          } | tee host-baseline.txt

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: consensus-specs/pyproject.toml

      - name: Install uv ${{ vars.UV_VERSION }}
        uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          enable-cache: true
          version: ${{ vars.UV_VERSION }}

      - name: Calibration generate (timeboxed)
        id: calibrate
        run: |
          set -uo pipefail
          mkdir -p consensus-spec-tests/tests
          cd consensus-specs

          START_EPOCH=$(date +%s)
          echo "CALIBRATION_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a ../shard-metrics.txt

          set +e
          timeout --signal=TERM --kill-after=60s "${CALIBRATION_MINUTES}m" \
            make reftests verbose=true \
              threads="${GEN_THREADS}" \
              runner="${SHARD_RUNNERS}" \
            2>&1 | tee ../consensustestgen-shard.log
          PIPE_RC=${PIPESTATUS[0]}
          set -e

          END_EPOCH=$(date +%s)
          ELAPSED=$((END_EPOCH-START_EPOCH))
          GENERATED=$(grep -c '^Generated:' ../consensustestgen-shard.log || true)
          SKIPPED=$(grep -c '^Skipped:' ../consensustestgen-shard.log || true)
          PROGRESS=$(grep '^Progress:' ../consensustestgen-shard.log | tail -1 || true)
          CPS=0
          if [ "$ELAPSED" -gt 0 ]; then
            CPS=$(awk -v g="${GENERATED:-0}" -v e="$ELAPSED" 'BEGIN{printf "%.4f", g/e}')
          fi

          {
            echo "CALIBRATION_END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "ELAPSED_SEC=$ELAPSED"
            echo "EXIT_CODE=$PIPE_RC"
            echo "GENERATED_LINES=$GENERATED"
            echo "SKIPPED_LINES=$SKIPPED"
            echo "CASES_PER_SECOND=$CPS"
            echo "LAST_PROGRESS=$PROGRESS"
            echo "SHARD_ID=${SHARD_ID}"
            echo "SHARD_RUNNERS=${SHARD_RUNNERS}"
            echo "THREADS=${GEN_THREADS}"
            echo "CHECKED_OUT_HEAD=$(git rev-parse HEAD)"
            echo "FULL_BUILD_AUTHORISED=NO"
            echo "DETERMINISM_RUN_2_AUTHORISED=NO"
          } | tee -a ../shard-metrics.txt

          {
            echo "=== free -h (after) ==="; free -h
            echo "=== df -h (after) ==="; df -h
          } | tee ../host-after.txt

          # Accept ONLY exit 0 (completed) or 124 (expected timebox).
          # Any other RC is a hard failure (no false-green on generator errors).
          if [ "$PIPE_RC" -eq 124 ]; then
            if [ "${GENERATED:-0}" -eq 0 ] && [ "${SKIPPED:-0}" -eq 0 ]; then
              echo "FAIL_REASON=ZERO_PROGRESS" | tee -a ../shard-metrics.txt
              exit 1
            fi
            echo "CALIBRATION_RESULT=TIMEBOX_WITH_PROGRESS" | tee -a ../shard-metrics.txt
            exit 0
          fi
          if [ "$PIPE_RC" -eq 0 ]; then
            if [ "${GENERATED:-0}" -eq 0 ] && [ "${SKIPPED:-0}" -eq 0 ]; then
              echo "FAIL_REASON=ZERO_PROGRESS" | tee -a ../shard-metrics.txt
              exit 1
            fi
            echo "CALIBRATION_RESULT=SUBSET_COMPLETED" | tee -a ../shard-metrics.txt
            exit 0
          fi
          echo "FAIL_REASON=UNEXPECTED_EXIT_CODE_$PIPE_RC" | tee -a ../shard-metrics.txt
          exit 1

      - name: Upload shard calibration artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: calibration-${{ matrix.shard_id }}
          path: |
            shard-identity.txt
            shard-metrics.txt
            official-runners.txt
            host-baseline.txt
            host-after.txt
            consensustestgen-shard.log

  calibration-summary:
    name: calibration-summary (no full build)
    runs-on: ubuntu-latest
    needs: calibrate-shard
    if: always()
    steps:
      - name: Record matrix policy
        run: |
          cat <<'EOF' | tee calibration-policy.txt
          MODE=SIX_SHARD_CALIBRATION_MATRIX_ONLY
          FULL_BUILD_AUTHORISED=NO
          DETERMINISM_RUN_2_AUTHORISED=NO
          ARCHIVES_AUTHORISED=NO
          PR_MERGE=NO
          NEXT_STAGE=REVIEW_SIX_SHARD_METRICS_THEN_WEIGHTED_SHARD_PLAN
          EOF
      - name: Upload policy note
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: calibration-policy
          path: calibration-policy.txt
