name: Nightly Reference Tests

# TARGETED_FORK_CALIBRATION
# - Single CLI runner: fork (NOT file stem forks)
# - Inventory uses TestCase.runner_name sources, not runners/*.py basenames
# - workflow_dispatch only
# - GEN_REF / EXPECTED_HEAD locked to repair commit d12911dda
# - NO full build, NO run-2, NO archives, NO publication

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Locked generation SHA
        default: d12911ddab573ceb1468de56d1428fba539dd4ae
        type: string
        required: true
      calibration_minutes:
        description: Hard timebox minutes per runner
        default: "10"
        type: string
        required: true
      threads:
        description: Worker threads per runner
        default: "2"
        type: string
        required: true

jobs:
  calibrate-runner:
    name: calibrate-${{ matrix.runner }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        runner:
          - fork
    env:
      GEN_REPO: sila-chain/consensus-specs
      GEN_REF: ${{ inputs.ref }}
      EXPECTED_HEAD: d12911ddab573ceb1468de56d1428fba539dd4ae
      CALIBRATION_MINUTES: ${{ inputs.calibration_minutes }}
      GEN_THREADS: ${{ inputs.threads }}
      # Do NOT use RUNNER_NAME — reserved by GitHub Actions hosted runners.
      CALIBRATION_RUNNER: ${{ matrix.runner }}
      MODE: TARGETED_FORK_CALIBRATION
      FULL_BUILD_AUTHORISED: "NO"
      DETERMINISM_RUN_2_AUTHORISED: "NO"

    steps:
      - name: Checkout locked source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          repository: ${{ env.GEN_REPO }}
          path: consensus-specs
          ref: ${{ env.GEN_REF }}

      - name: Verify checkout SHA and CLI runner inventory
        working-directory: consensus-specs
        run: |
          set -euo pipefail
          HEAD=$(git rev-parse HEAD)
          {
            echo "MODE=${MODE}"
            echo "CALIBRATION_RUNNER=${CALIBRATION_RUNNER}"
            echo "GEN_REPO=${GEN_REPO}"
            echo "GEN_REF=${GEN_REF}"
            echo "EXPECTED_HEAD=${EXPECTED_HEAD}"
            echo "CHECKED_OUT_HEAD=${HEAD}"
            echo "THREADS=${GEN_THREADS}"
            echo "CALIBRATION_MINUTES=${CALIBRATION_MINUTES}"
            echo "WORKFLOW_SHA=${{ github.sha }}"
            echo "EVENT_NAME=${{ github.event_name }}"
            echo "INVENTORY_SOURCE=TestCase.runner_name_literals"
          } | tee ../runner-identity.txt

          if [ "$HEAD" != "$EXPECTED_HEAD" ]; then
            echo "FAIL_REASON=CHECKOUT_SHA_MISMATCH"
            exit 1
          fi

          # Discover CLI runner names that become TestCase.runner_name.
          # Do NOT use runners/*.py basenames (forks.py emits runner_name="fork").
          mapfile -t OFFICIAL < <(
            python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("tests/generators/runners")
          names: set[str] = set()
          for path in sorted(root.glob("*.py")):
              if path.name.startswith("_"):
                  continue
              text = path.read_text(encoding="utf-8")
              if not re.search(r"^def get_test_cases\b", text, re.M):
                  continue
              names.update(re.findall(r'runner_name\s*=\s*["\']([^"\']+)["\']', text))
              names.update(re.findall(r'get_test_cases_for\s*\(\s*["\']([^"\']+)["\']', text))
          for name in sorted(names):
              print(name)
          PY
          )
          printf '%s\n' "${OFFICIAL[@]}" | tee ../official-runners.txt
          echo "OFFICIAL_CLI_RUNNER_COUNT=${#OFFICIAL[@]}" | tee -a ../runner-identity.txt
          echo "FILE_STEM_forks_PRESENT=$(test -f tests/generators/runners/forks.py && echo YES || echo NO)" | tee -a ../runner-identity.txt
          echo "CLI_NAME_fork_IN_INVENTORY=$(printf '%s\n' "${OFFICIAL[@]}" | grep -qx fork && echo YES || echo NO)" | tee -a ../runner-identity.txt

          found=0
          for o in "${OFFICIAL[@]}"; do
            if [ "$o" = "$CALIBRATION_RUNNER" ]; then found=1; break; fi
          done
          if [ "$found" -ne 1 ]; then
            echo "FAIL_REASON=UNKNOWN_RUNNER actual=${CALIBRATION_RUNNER}"
            exit 1
          fi
          echo "UNKNOWN_RUNNER_COUNT=0" | tee -a ../runner-identity.txt

      - name: Host baseline
        run: |
          set -euo pipefail
          {
            echo "=== free -h ==="; free -h
            echo "=== nproc ==="; nproc
            echo "=== df -h ==="; df -h
            echo "=== lscpu ==="; lscpu | sed -n '1,20p'
          } | tee host-baseline.txt

      - name: Set up Python
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version-file: consensus-specs/pyproject.toml

      - name: Install uv ${{ vars.UV_VERSION }}
        uses: astral-sh/setup-uv@5a7eac68fb9809dea845d802897dc5c723910fa3 # v7.1.3
        with:
          enable-cache: true
          version: ${{ vars.UV_VERSION }}

      - name: Calibration generate (timeboxed single runner)
        run: |
          set -uo pipefail
          mkdir -p consensus-spec-tests/tests
          cd consensus-specs

          START_EPOCH=$(date +%s)
          echo "CALIBRATION_START_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)" | tee -a ../runner-metrics.txt

          set +e
          timeout --signal=TERM --kill-after=60s "${CALIBRATION_MINUTES}m" \
            make reftests verbose=true \
              threads="${GEN_THREADS}" \
              runner="${CALIBRATION_RUNNER}" \
            2>&1 | tee ../consensustestgen-runner.log
          PIPE_RC=${PIPESTATUS[0]}
          set -e

          END_EPOCH=$(date +%s)
          ELAPSED=$((END_EPOCH-START_EPOCH))
          GENERATED=$(grep -c '^Generated:' ../consensustestgen-runner.log || true)
          SKIPPED=$(grep -c '^Skipped:' ../consensustestgen-runner.log || true)
          GENERATED=${GENERATED:-0}
          SKIPPED=${SKIPPED:-0}
          PROCESSED=$((GENERATED + SKIPPED))
          SELECTED=$(grep -E 'Selected [0-9]+' ../consensustestgen-runner.log | tail -1 || true)
          PROGRESS=$(grep '^Progress:' ../consensustestgen-runner.log | tail -1 || true)
          CPS=0
          PROCESSED_CPS=0
          if [ "$ELAPSED" -gt 0 ]; then
            CPS=$(awk -v g="${GENERATED}" -v e="$ELAPSED" 'BEGIN{printf "%.4f", g/e}')
            PROCESSED_CPS=$(awk -v p="${PROCESSED}" -v e="$ELAPSED" 'BEGIN{printf "%.4f", p/e}')
          fi

          {
            echo "CALIBRATION_END_UTC=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "RUNNER=${CALIBRATION_RUNNER}"
            echo "ELAPSED_SEC=$ELAPSED"
            echo "EXIT_CODE=$PIPE_RC"
            echo "GENERATED_LINES=$GENERATED"
            echo "SKIPPED_LINES=$SKIPPED"
            echo "PROCESSED_LINES=$PROCESSED"
            echo "CASES_PER_SECOND=$CPS"
            echo "PROCESSED_PER_SECOND=$PROCESSED_CPS"
            echo "LAST_SELECTED=$SELECTED"
            echo "LAST_PROGRESS=$PROGRESS"
            echo "THREADS=${GEN_THREADS}"
            echo "CHECKED_OUT_HEAD=$(git rev-parse HEAD)"
            echo "FULL_BUILD_AUTHORISED=NO"
            echo "DETERMINISM_RUN_2_AUTHORISED=NO"
          } | tee -a ../runner-metrics.txt

          {
            echo "=== free -h (after) ==="; free -h
            echo "=== df -h (after) ==="; df -h
          } | tee ../host-after.txt

          if [ "$PIPE_RC" -eq 124 ]; then
            if [ "$PROCESSED" -le 0 ]; then
              echo "RESULT=FAIL_ZERO_PROGRESS_ON_TIMEOUT" | tee -a ../runner-metrics.txt
              exit 1
            fi
            echo "RESULT=TIMEBOX_WITH_PROGRESS" | tee -a ../runner-metrics.txt
            exit 0
          fi
          if [ "$PIPE_RC" -eq 0 ]; then
            if [ "$PROCESSED" -le 0 ]; then
              echo "RESULT=FAIL_ZERO_PROGRESS_ON_SUCCESS" | tee -a ../runner-metrics.txt
              exit 1
            fi
            echo "RESULT=COMPLETED" | tee -a ../runner-metrics.txt
            exit 0
          fi
          echo "RESULT=FAIL_UNEXPECTED_EXIT_CODE_$PIPE_RC" | tee -a ../runner-metrics.txt
          exit 1

      - name: Upload per-runner calibration artifact
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: calibration-runner-${{ matrix.runner }}
          path: |
            runner-identity.txt
            runner-metrics.txt
            official-runners.txt
            host-baseline.txt
            host-after.txt
            consensustestgen-runner.log

  calibration-summary:
    name: calibration-summary (targeted fork)
    runs-on: ubuntu-latest
    needs: calibrate-runner
    if: always()
    steps:
      - name: Download all runner artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: calibration-runner-*
          path: artifacts
          merge-multiple: false

      - name: Build summary TSV
        run: |
          set -euo pipefail
          {
            echo -e "runner\texit_code\tgenerated\tskipped\tprocessed\telapsed\tgenerated_cps\tprocessed_cps\tlast_progress\tchecked_out_head\tresult"
            for d in artifacts/calibration-runner-*; do
              [ -d "$d" ] || continue
              metrics="$d/runner-metrics.txt"
              [ -f "$metrics" ] || continue
              runner=$(awk -F= '/^RUNNER=/{print $2; exit}' "$metrics")
              exit_code=$(awk -F= '/^EXIT_CODE=/{print $2; exit}' "$metrics")
              generated=$(awk -F= '/^GENERATED_LINES=/{print $2; exit}' "$metrics")
              skipped=$(awk -F= '/^SKIPPED_LINES=/{print $2; exit}' "$metrics")
              processed=$(awk -F= '/^PROCESSED_LINES=/{print $2; exit}' "$metrics")
              elapsed=$(awk -F= '/^ELAPSED_SEC=/{print $2; exit}' "$metrics")
              cps=$(awk -F= '/^CASES_PER_SECOND=/{print $2; exit}' "$metrics")
              pcps=$(awk -F= '/^PROCESSED_PER_SECOND=/{print $2; exit}' "$metrics")
              progress=$(awk -F= '/^LAST_PROGRESS=/{sub(/^LAST_PROGRESS=/,""); print; exit}' "$metrics")
              head=$(awk -F= '/^CHECKED_OUT_HEAD=/{print $2; exit}' "$metrics")
              result=$(awk -F= '/^RESULT=/{print $2; exit}' "$metrics")
              printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' \
                "${runner}" "${exit_code}" "${generated}" "${skipped}" "${processed}" \
                "${elapsed}" "${cps}" "${pcps}" "${progress}" "${head}" "${result}"
            done | sort
          } | tee targeted-fork-calibration-summary.tsv

          {
            echo "MODE=TARGETED_FORK_CALIBRATION"
            echo "EXPECTED_HEAD=d12911ddab573ceb1468de56d1428fba539dd4ae"
            echo "MATRIX_JOB_COUNT=1"
            echo "CALIBRATION_RUNNER=fork"
            echo "FULL_BUILD_AUTHORISED=NO"
            echo "DETERMINISM_RUN_2_AUTHORISED=NO"
            echo "ARCHIVES_AUTHORISED=NO"
            echo "PR_MERGE=NO"
            echo "NEXT_STAGE=REVIEW_FORK_CALIBRATION_THEN_WEIGHTED_SHARD_PLAN"
          } | tee calibration-policy.txt

      - name: Upload summary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: targeted-fork-calibration-summary
          path: |
            targeted-fork-calibration-summary.tsv
            calibration-policy.txt
