name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    timeout-minutes: 1440 # 24 hours
    runs-on: [self-hosted-ghr-custom, size-xl-x64, profile-consensusSpecs]
    permissions:
      contents: write
      packages: write
      pull-requests: read

    steps:
      # Clone specs
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: "consensus-specs"

      # Setup python
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "consensus-specs/pyproject.toml"

      - name: Install uv ${{ vars.UV_VERSION }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: ${{ vars.UV_VERSION }}

      # Check the tag matches the version
      - name: Version check
        run: |
          tag="${{ github.ref_name }}"
          version="v$(cat consensus-specs/tests/core/pyspec/sil2spec/VERSION.txt)"
          if [ "$tag" != "$version" ]; then
            echo "Tag ($tag) does not match version ($version)"
            exit 1
          fi

      # Ensure framework tests pass
      - name: Run tests for framework
        run: |
          cd consensus-specs
          make test component=fw

      # Ensure minimal tests pass
      - name: Run tests for minimal
        run: |
          cd consensus-specs
          make test component=pyspec preset=minimal

      # Ensure sila-mainnet tests pass
      - name: Run tests for sila-mainnet
        run: |
          cd consensus-specs
          make test component=pyspec preset=sila-mainnet

      # Write reference tests to the spec tests repo
      - name: Generate reference tests
        run: |
          cd consensus-specs
          make reftests verbose=true

      # Make tarballs
      - name: Archive configurations
        run: |
          cd consensus-spec-tests
          tar -czvf general.tar.gz tests/general
          tar -czvf minimal.tar.gz tests/minimal
          tar -czvf sila-mainnet.tar.gz tests/sila-mainnet

      # Publish the specs release. We use release-drafter to
      # organize PRs into the appropriate section based on PR labels
      - name: Publish specs release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Upload spec test tarballs to the specs release
      - name: Upload spec test tarballs
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            consensus-spec-tests/general.tar.gz
            consensus-spec-tests/minimal.tar.gz
            consensus-spec-tests/sila-mainnet.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
