name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  version:
    name: version gate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag matches package version
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          version="v$(cat tests/core/pyspec/sil2spec/VERSION.txt)"
          echo "TAG=${tag}"
          echo "VERSION=${version}"
          test "$tag" = "$version"

  framework:
    name: framework
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv ${{ vars.UV_VERSION }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: ${{ vars.UV_VERSION }}
      - name: Run framework tests
        run: make test component=fw

  pyspec:
    name: ${{ matrix.preset }} / ${{ matrix.fork }}
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset:
          - minimal
          - sila-mainnet
        fork:
          - phase0
          - altair
          - bellatrix
          - capella
          - deneb
          - electra
          - fulu
          - gloas
          - sip7805
          - sip7928
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv ${{ vars.UV_VERSION }}
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: ${{ vars.UV_VERSION }}
      - name: Run pyspec tests
        run: make test component=pyspec preset=${{ matrix.preset }} fork=${{ matrix.fork }}

  reference-tests:
    name: sharded reference tests
    needs: [framework, pyspec]
    uses: ./.github/workflows/nightly-reftests.yml
    with:
      ref: ${{ github.sha }}
      expected_head: ${{ github.sha }}
      threads: "2"
      authorise_full_build: "YES"

  publish:
    name: publish release
    needs: reference-tests
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
      pull-requests: read
    steps:
      - name: Download general reference tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: General Test Configuration
          path: release-assets
      - name: Download minimal reference tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: Minimal Test Configuration
          path: release-assets
      - name: Download SilaMainnet reference tests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SilaMainnet Test Configuration
          path: release-assets
      - name: Publish specs release
        uses: release-drafter/release-drafter@34d80673e067bdc0c24568d3af899c216adcfaa9 # v7.7.0
        with:
          name: ${{ github.ref_name }}
          tag: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          publish: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload spec test tarballs
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            release-assets/general.tar.gz
            release-assets/minimal.tar.gz
            release-assets/sila-mainnet.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
