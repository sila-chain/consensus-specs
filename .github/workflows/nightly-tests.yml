name: Nightly SilaMainnet Tests

defaults:
  run:
    shell: bash -e {0}

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      ref:
        description: The branch, tag or SHA to checkout and build from
        default: main
        type: string
        required: true
  schedule:
    # Every day at 00:00 UTC
    - cron: "0 0 * * *"

jobs:
  tests:
    timeout-minutes: 360 # 6 hours on GitHub-hosted runners
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fork:
          - phase0
          - altair
          - bellatrix
          - capella
          - deneb
          - electra
          - fulu
          - gloas
          - sip7805
          - sip7928
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: "pyproject.toml"
      - name: Install uv ${{ vars.UV_VERSION }}
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          version: ${{ vars.UV_VERSION }}
      - name: test-${{ matrix.fork }}
        run: make test component=pyspec preset=sila-mainnet fork=${{ matrix.fork }}
      - name: Prepare test results for upload
        if: always()
        run: cp -r ./tests/core/pyspec/test-reports ./tests/core/pyspec/test-results-sila-mainnet-${{ matrix.fork }}-${{ github.run_number }}
      - name: Upload ${{ matrix.fork }} test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results-sila-mainnet-${{ matrix.fork }}-${{ github.run_number }}
          path: ./tests/core/pyspec/test-results-sila-mainnet-${{ matrix.fork }}-${{ github.run_number }}
